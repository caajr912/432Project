<!DOCTYPE html>
<html>

<head>

<title>Stock Insight</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <h2>📊 Finance Insights</h2>
</nav>

<div class="container">

<h1>Stock Dashboard</h1>

<!-- SEARCH -->
<div class="search-box">
    <input id="ticker" placeholder="Name of stock (AAPL)">
    <button onclick="getStock()">Search</button>
</div>

<!-- CHART -->
<div class="card">
    <h3>Stock Price</h3>
    <canvas id="stockChart"></canvas>
</div>

<!-- GRID SECTION -->
<div class="info-grid">

    <!-- OVERVIEW -->
    <div class="info-card">
        <h3>Overview</h3>
        <p id="price"></p>
        <p>Market Cap: $13.3B</p>
        <p>P/E Ratio: 13.5</p>
    </div>

    <!-- NEWS -->
    <div class="info-card">
        <h3>Latest News</h3>
        <div id="newsList"></div>
    </div>

    <!-- TECH -->
    <div class="info-card">
        <h3>Technical Indicators</h3>
        <p>Low: $1.95</p>
        <p>High: $18.20</p>
        <p style="color:green;">Trend: Positive</p>
    </div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
